<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blutdruck Tagebuch · Blood Pressure Diary</title>
  <style>
    .modal-wide { max-width: 720px !important; max-height: 92vh !important; }
    .measure-body { gap: 14px !important; }
    .measure-intro { font-size: 13px !important; }
    .measure-visual { display: flex; flex-direction: column; gap: 16px; }
    .mv-section-h {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-50);
      margin: 0 0 10px;
    }
    .prep-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .prep-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
    }
    .prep-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
    }
    .prep-label {
      font-size: 11px;
      color: var(--fg-70);
      line-height: 1.3;
      text-wrap: balance;
    }
    @media (max-width: 640px) {
      .prep-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>(function(){var s=localStorage.getItem("darkMode");var dark=s!==null?s==="true":!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(s===null)localStorage.setItem("darkMode",dark?"true":"false");document.documentElement.setAttribute("data-theme",dark?"dark":"light");})();</script>
  <link rel="stylesheet" href="src/styles.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/recharts@2.15.0/umd/Recharts.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/chart.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/pdf-export.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (isDev) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
      } else {
        navigator.serviceWorker.register('/sw.js');
        navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
      }
    }
  </script>
</body>
</html>
