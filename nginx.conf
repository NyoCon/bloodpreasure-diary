events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location ~* \.jsx$ {
            default_type application/javascript;
        }

        location = /sw.js {
            add_header Cache-Control "no-store";
        }
    }
}
